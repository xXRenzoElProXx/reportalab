services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reportalab
      POSTGRES_USER: reportalab
      POSTGRES_PASSWORD: reportalab_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportalab -d reportalab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
